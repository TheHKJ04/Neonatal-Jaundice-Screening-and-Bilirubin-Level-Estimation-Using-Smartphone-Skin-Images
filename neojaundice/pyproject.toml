[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"


[project]
name = "neojaundice"
version = "0.1.0"
description = "Research platform for neonatal jaundice screening and bilirubin estimation"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "NeoJaundice Research Team" }
]

keywords = [
    "computer-vision",
    "deep-learning",
    "neonatal-jaundice",
    "bilirubin-estimation",
    "medical-ai"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3"
]


[project.optional-dependencies]

backend = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.9,<1"
]

cv = [
    "opencv-python-headless>=4.9,<5",
    "albumentations>=1.4,<3",
    "pillow>=10,<13",
    "scikit-image>=0.24,<1",
    "mediapipe>=0.10,<1"
]

ml = [
    "torch>=2.3,<3",
    "torchvision>=0.18,<1",
    "scikit-learn>=1.5,<2",
    "timm>=1.0,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1"
]

mlops = [
    "mlflow>=2.15,<4",
    "dvc>=3.5,<4",
    "hydra-core>=1.3,<2",
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2"
]

monitoring = [
    "prometheus-client>=0.20,<1",
    "structlog>=24,<27"
]

dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5"
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "ml",
    "ml.*",
    "backend",
    "backend.*"
]
namespaces = true


[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"


[tool.ruff]
line-length = 88
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "data",
    "models",
    "experiments",
    "mlflow",
    "notebooks"
]


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I"
]


[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true