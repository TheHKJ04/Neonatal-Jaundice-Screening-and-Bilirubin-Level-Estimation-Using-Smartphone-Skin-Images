schema_version: "1.0"

experiment:
  name: roi_method_comparison
  description: Compare YCrCb and HSV coverage within geometric ROIs

methods:
  - ycrcb
  - hsv

regions:
  - forehead
  - sternum

statistics:
  bootstrap_iterations: 2000
  confidence_level: 0.95
  random_seed: 42

analysis:
  near_full_coverage_threshold: 0.95
  disagreement_threshold: 0.05

research:
  clinical_validation: false
  segmentation_ground_truth_available: false
  patient_independence_verified: false
