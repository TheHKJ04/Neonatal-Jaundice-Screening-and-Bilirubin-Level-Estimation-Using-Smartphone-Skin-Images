# Use together with docker-compose.api.yml so the frontend and API share
# the same Compose network. The API service name is `api` in that file.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: neojaundice-frontend:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      API_UPSTREAM: ${NEOJAUNDICE_API_UPSTREAM:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
