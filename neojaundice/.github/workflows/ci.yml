name: NeoJaundice CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Python Quality Checks

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install development dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "hydra-core>=1.3,<2"

      - name: Verify dependencies
        run: |
          python scripts/verify_dependencies.py
          python -m pip check

      - name: Ruff lint
        run: |
          python -m ruff check scripts backend ml tests

      - name: Ruff formatting
        run: |
          python -m ruff format --check scripts backend ml tests

      - name: Verify project structure
        run: |
          python scripts/verify_structure.py

      - name: Verify application configuration
        run: |
          python scripts/verify_config.py

      - name: Verify quality configuration
        run: |
          python scripts/verify_quality_config.py

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit -v --cov=backend --cov=ml --cov=scripts --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
