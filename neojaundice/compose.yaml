name: neojaundice

services:
  app-check:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev

    image: neojaundice-dev:local

    environment:
      APP_ENV: development
      DEBUG: "false"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - neojaundice-network

  postgres:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-neojaundice}
      POSTGRES_USER: ${DB_USER:-neojaundice}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - neojaundice-network


volumes:
  postgres-data:


networks:
  neojaundice-network:
    driver: bridge
